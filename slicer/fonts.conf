<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for OpenSCAD renders: the system fonts plus any copied into the
     config folder's "fonts" directory (e.g. from C:\Windows\Fonts). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/config/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
