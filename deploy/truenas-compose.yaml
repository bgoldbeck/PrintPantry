# Compose file for the "printpantry" custom app on TrueNAS.
# The image is built on the NAS from the git checkout in src/repo;
# `pull_policy: build` makes every redeploy rebuild it from the latest code.
# To move pools, change /mnt/testpool/printpantry in the paths below
# (and PP_NAS_ROOT in scripts\_config.cmd).
services:
  printpantry:
    build:
      context: /mnt/testpool/printpantry/src/repo
    image: printpantry:local
    pull_policy: build
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8484:8484"
    environment:
      PP_PASSWORD: ""          # filled in on the NAS from src/.pp_password
      PP_SESSION_DAYS: "365"   # stay logged in for a year
      PP_SCAN_INTERVAL: "300"
      PP_U1_URL: "http://192.168.1.52:7125"
      PP_P1S_HOST: ""          # these three filled in on the NAS from src/.pp_p1s
      PP_P1S_SERIAL: ""
      PP_P1S_ACCESS_CODE: ""
      PP_SLICER_URL: "http://slicer:8485"
      TZ: "America/Los_Angeles"
    volumes:
      - /mnt/testpool/printpantry/library:/library   # writable: imports from Printables/MakerWorld land here
      - /mnt/testpool/printpantry/data:/data
    logging:                 # cap container logs at 3 x 10 MB
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # OrcaSlicer's command line behind a small HTTP API (slicer/service.py).
  # Not published on the LAN; only the app above talks to it. It writes
  # sliced files into the library, next to the source, in "sliced" folders.
  slicer:
    build:
      context: /mnt/testpool/printpantry/src/repo
      dockerfile: slicer/Dockerfile
    image: printpantry-slicer:local
    pull_policy: build
    restart: unless-stopped
    user: "568:568"
    environment:
      TZ: "America/Los_Angeles"
    volumes:
      - /mnt/testpool/printpantry/library:/library
      - /mnt/testpool/printpantry/config:/config:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G           # one slice at a time; small models need a few hundred MB
