# Front door for Print Pantry on the NAS, port 8484, for both:
#   http://192.168.1.140:8484/              (home network, plain HTTP as before)
#   https://animalfarm.duckdns.org:8484/    (internet: pfSense forwards WAN 8484 to NAS 8486;
#                                            at home that name resolves to the NAS itself)
# Port 8484 looks at the first bytes of each connection: TLS goes to the HTTPS server,
# anything else to the plain HTTP one. The app itself listens on NAS port 8483.
# TLS uses the Let's Encrypt certificate that /mnt/testpool/lego/renew-cert.sh keeps fresh.
# The app enforces the login on every route; this adds a second brake on password guessing.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

stream {
  map $ssl_preread_protocol $pp_front {
    ""      127.0.0.1:8487;   # not TLS: plain HTTP server
    default 127.0.0.1:8488;   # TLS: HTTPS server
  }
  server {
    listen 8484;
    ssl_preread on;
    proxy_protocol on;        # pass the browser's address on to the http servers
    proxy_pass $pp_front;
  }
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Connections relayed by the stream block above carry the real address in PROXY protocol.
  set_real_ip_from 127.0.0.1;
  real_ip_header proxy_protocol;

  limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

  client_max_body_size 64m;
  # Which scheme the browser used; sent to the app as X-Forwarded-Proto.
  # (All proxy_set_header lines stay here at http level: a proxy_set_header inside a
  # server block would silently drop every one of these, including Host, and the
  # app's cross-site check would then refuse every login.)
  map $server_port $pp_proto {
    8487    http;
    default https;
  }
  # Host keeps the port so the app's cross-site (Origin) check matches.
  # X-Forwarded-For is overwritten, not appended, so a client can't fake it.
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $pp_proto;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 600s;

  server {
    listen 8486 ssl;                          # straight from pfSense (internet)
    listen 127.0.0.1:8488 ssl proxy_protocol; # via port 8484
    server_name animalfarm.duckdns.org;
    ssl_certificate /etc/printpantry/tls.crt;
    ssl_certificate_key /etc/printpantry/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    # Plain http:// sent to the TLS-only port 8486 gets sent to https://
    error_page 497 =301 https://$http_host$request_uri;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://host.docker.internal:8483;
    }
    location / {
      proxy_pass http://host.docker.internal:8483;
    }
  }

  server {
    listen 127.0.0.1:8487 proxy_protocol;     # plain HTTP via port 8484 (home network)
    location = /login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://host.docker.internal:8483;
    }
    location / {
      proxy_pass http://host.docker.internal:8483;
    }
  }
}
