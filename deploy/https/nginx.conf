# HTTPS front door for Print Pantry from the internet:
#   https://animalfarm.duckdns.org:8484/  (pfSense forwards WAN 8484 to TrueNAS 8486)
# Terminates TLS with the Let's Encrypt certificate that /mnt/testpool/lego/renew-cert.sh
# keeps fresh, and passes everything to the app on the LAN port. The app itself
# enforces the login on every route; this adds a second brake on password guessing.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

  server {
    listen 8486 ssl;
    server_name animalfarm.duckdns.org;
    ssl_certificate /etc/printpantry/tls.crt;
    ssl_certificate_key /etc/printpantry/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    # Plain http:// on this port gets sent to https://
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Host keeps the :8484 so the app's cross-site (Origin) check matches.
    # X-Forwarded-For is overwritten, not appended, so a client can't fake it.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;

    location = /login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://host.docker.internal:8484;
    }
    location / {
      proxy_pass http://host.docker.internal:8484;
    }
  }
}
