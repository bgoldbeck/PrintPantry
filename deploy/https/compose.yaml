# TrueNAS custom app "printpantry-https": nginx in front of Print Pantry: serves port
# 8484 (http on the LAN, https from the internet) and passes it to the app on 8483.
# Installed and updated by truenas.sh setup/update/https.
services:
  https:
    image: nginx@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    pull_policy: missing
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    user: "__UID__:__UID__"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    restart: unless-stopped
    # Host networking: nginx listens on the NAS's own ports 8484 (home network http and
    # LAN https, picked by the first bytes) and 8486 (https from the internet, pfSense
    # WAN 8484 -> here), and reaches the app at 127.0.0.1:8483. It used to go through
    # host.docker.internal, which also resolved to an IPv6 gateway (fdd0::1) that
    # resets every connection: GETs were retried quietly, but button presses (POSTs)
    # came back as "Bad Gateway".
    network_mode: host
    volumes:
      - __CERT_DIR__/public.crt:/etc/printpantry/tls.crt:ro
      - __CERT_DIR__/public.key:/etc/printpantry/tls.key:ro
      - __ROOT__/https/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q", "-c", "/etc/nginx/nginx.conf"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
